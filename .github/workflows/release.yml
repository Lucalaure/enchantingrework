# Builds the mod and attaches the jar to a GitHub release. Two ways to release:
#
# 1. Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`). The tag must match `version` in
#    gradle.properties; a release is created with that version's section of CHANGELOG.md as its notes.
# 2. Create and publish a release on the GitHub website (any tag name). The jar is attached to it.
#
# GitHub always adds "Source code" archives to releases; the jar is listed above them.

name: release
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check tag matches mod version
        if: github.event_name == 'push'
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: extract release notes
        if: github.event_name == 'push'
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
      - name: create release from tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Enchanting Rework ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            $(ls build/libs/*.jar | grep -v -- '-sources.jar')
      - name: attach jar to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            $(ls build/libs/*.jar | grep -v -- '-sources.jar')
